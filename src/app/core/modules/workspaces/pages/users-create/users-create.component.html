<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Crea utente" [description]="isReseller() ? 'Aggiungi un utente al tenant: oltre le postazioni del contratto ti viene addebitato.' : 'Aggiungi un utente al tenant: oltre le postazioni del contratto si addebita.'">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="form?.userForm?.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form?.userForm?.invalid || !form.steps.allVisited()" (click)="createUser(form.userForm)">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- User form for creating a new user -->
  <rocket-user-form class="flex-1 min-h-0 flex flex-col" #form [creating]="true" [productData]="product()" [fixedTenant]="fixedTenant()"/>
</div>
