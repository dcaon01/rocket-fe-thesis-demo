<main class="h-svh w-full flex flex-col md:flex-row overflow-hidden">
  <!-- Left: form panel -->
  <section class="flex-1 flex flex-col gap-4 bg-background p-10 overflow-y-auto">
    <!-- Product name -->
    <div class="flex items-center justify-center md:justify-start gap-2">
      <span class="flex size-6 items-center justify-center rounded-md border bg-card">
        <img src="keus-pittogramma.svg" alt="" width="16" height="16" />
      </span>
      <span class="text-sm font-semibold leading-none">Rocket</span>
    </div>

    <div class="flex-1 flex items-center justify-center">
      <div class="w-full max-w-[374px] flex flex-col gap-6">
        <!-- Heading -->
        <div class="flex flex-col gap-2 text-center">
          <h2 class="text-2xl font-semibold">Primo accesso</h2>
          <p class="text-sm text-muted-foreground">Imposta la tua password per continuare.</p>
        </div>

        <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()" class="flex flex-col gap-6">
          <!-- New password -->
          <div class="grid gap-3">
            <label hlmLabel for="password">Nuova password</label>
            <hlm-input-group>
              <input [type]="showPassword() ? 'text' : 'password'" id="password" placeholder="Nuova password" required hlmInputGroupInput formControlName="password" autocomplete="new-password" />
              <hlm-input-group-addon align="inline-end">
                <button hlmInputGroupButton size="icon-xs" type="button" [hlmTooltip]="showPassword() ? 'Nascondi password' : 'Mostra password'" [attr.aria-label]="showPassword() ? 'Nascondi password' : 'Mostra password'" (click)="showPassword.set(!showPassword())">
                  <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" size="16" />
                </button>
              </hlm-input-group-addon>
            </hlm-input-group>

            <!-- Password requirements: each turns green once met -->
            <ul class="flex flex-col gap-1.5 mt-1 text-sm">
              <li class="flex items-center gap-2 transition-colors" [class.text-success]="passwordRequirements().hasMinLength" [class.text-muted-foreground]="!passwordRequirements().hasMinLength">
                <ng-icon [name]="passwordRequirements().hasMinLength ? 'lucideCircleCheck' : 'lucideCircle'" size="16" />
                Almeno 8 caratteri
              </li>
              <li class="flex items-center gap-2 transition-colors" [class.text-success]="passwordRequirements().hasUpperCase" [class.text-muted-foreground]="!passwordRequirements().hasUpperCase">
                <ng-icon [name]="passwordRequirements().hasUpperCase ? 'lucideCircleCheck' : 'lucideCircle'" size="16" />
                Una lettera maiuscola
              </li>
              <li class="flex items-center gap-2 transition-colors" [class.text-success]="passwordRequirements().hasNumber" [class.text-muted-foreground]="!passwordRequirements().hasNumber">
                <ng-icon [name]="passwordRequirements().hasNumber ? 'lucideCircleCheck' : 'lucideCircle'" size="16" />
                Un numero
              </li>
              <li class="flex items-center gap-2 transition-colors" [class.text-success]="passwordRequirements().hasSpecialChar" [class.text-muted-foreground]="!passwordRequirements().hasSpecialChar">
                <ng-icon [name]="passwordRequirements().hasSpecialChar ? 'lucideCircleCheck' : 'lucideCircle'" size="16" />
                Un carattere speciale
              </li>
            </ul>
          </div>

          <!-- Confirm password -->
          <div class="grid gap-3">
            <label hlmLabel for="confirmPassword">Conferma password</label>
            <hlm-input-group>
              <input [type]="showConfirmPassword() ? 'text' : 'password'" id="confirmPassword" placeholder="Conferma password" required hlmInputGroupInput formControlName="confirmPassword" autocomplete="new-password" />
              <hlm-input-group-addon align="inline-end">
                <button hlmInputGroupButton size="icon-xs" type="button" [hlmTooltip]="showConfirmPassword() ? 'Nascondi password' : 'Mostra password'" [attr.aria-label]="showConfirmPassword() ? 'Nascondi password' : 'Mostra password'" (click)="showConfirmPassword.set(!showConfirmPassword())">
                  <ng-icon [name]="showConfirmPassword() ? 'lucideEyeOff' : 'lucideEye'" size="16" />
                </button>
              </hlm-input-group-addon>
            </hlm-input-group>

            <!-- Match with the new password: green once the two are equal -->
            <ul class="flex flex-col gap-1.5 mt-1 text-sm">
              <li class="flex items-center gap-2 transition-colors" [class.text-success]="passwordsMatch()" [class.text-muted-foreground]="!passwordsMatch()">
                <ng-icon [name]="passwordsMatch() ? 'lucideCircleCheck' : 'lucideCircle'" size="16" />
                Le password coincidono
              </li>
            </ul>
          </div>

          <!-- Generic errors -->
          @if (errorMessage()) {
            <p class="text-destructive text-sm">{{ errorMessage() }}</p>
          }

          <!-- Submit -->
          <button hlmBtn type="submit" class="w-full" [disabled]="changePasswordForm.invalid || isLoading()">
            @if (isLoading()) {
              <ng-icon name="lucideLoaderCircle" class="animate-spin" />
            } @else {
              Salva e accedi
            }
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- Right: brand panel, the same as the login -->
  <rocket-auth-brand-panel class="hidden md:flex flex-1" />
</main>
