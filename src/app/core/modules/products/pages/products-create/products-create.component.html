<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Crea prodotto" description="Configura dati, integrazioni e strutture del nuovo prodotto.">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="form?.productForm?.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form?.productForm?.invalid || !form.steps.allVisited()" (click)="createProduct(form.productForm)">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- Product form for creating a new product -->
  <rocket-product-form class="flex-1 min-h-0 flex flex-col" #form [creating]="true" />
</div>
