<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Dettaglio piano" [description]="isReseller() ? 'Consulta prezzi e regole del piano.' : 'Modifica prezzi e regole del piano.'">
    <!-- Primary button: the changes to save, otherwise the activation of the draft -->
    @if (canManage() && planData()?.status === PlanStatus.Draft && !form?.changed()) {
      <button hlmBtn (click)="activatePlan()">
        <ng-icon name="lucidePlay" size="16" />
        Attiva
      </button>
    } @else if (canManage()) {
      <span class="inline-flex" [hlmTooltip]="!form?.changed() ? 'Nessuna modifica da salvare' : form?.planForm?.invalid ? 'Completa i campi obbligatori' : ''">
        <button hlmBtn [disabled]="form?.planForm?.invalid || !form?.changed()" (click)="updatePlan(form.planForm)">
          Conferma
        </button>
      </span>
    }
  </rocket-page-header>

  <!-- Plan form for editing -->
  <rocket-plan-form class="flex-1 min-h-0 flex flex-col" #form [planData]="planData()" [readonly]="!canManage()" />

  <!-- Activation confirmation dialog -->
  <!-- hidden: the dialog opens in an overlay, its host would only add a gap above the footer -->
  <hlm-dialog #activationDialog class="hidden">
    <hlm-dialog-content class="w-[500px]" *brnDialogContent="let ctx;">
      <hlm-dialog-header>
        <h3 hlmDialogTitle>Attivare il piano?</h3>
        <p hlmDialogDescription>
          Una volta attivato il piano <strong>non potrà più essere modificato.</strong>
        </p>
      </hlm-dialog-header>
      <hlm-dialog-footer>
        <button hlmBtn variant="outline" brnDialogClose (click)="cancelActivation()">Annulla</button>
        <button hlmBtn (click)="confirmActivation()">Conferma</button>
      </hlm-dialog-footer>
    </hlm-dialog-content>
  </hlm-dialog>
</div>
