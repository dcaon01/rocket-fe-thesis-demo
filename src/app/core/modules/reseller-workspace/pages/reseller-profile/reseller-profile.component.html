<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Scheda rivenditore" [description]="isReseller() ? 'Consulta i tuoi dati societari, le condizioni economiche e i documenti.' : 'Consulta dati societari, condizioni economiche e documenti del rivenditore.'">
    @if (canEdit()) {
      <span class="inline-flex" [hlmTooltip]="!card()?.changed() ? 'Nessuna modifica da salvare' : card()?.companyDataForm?.invalid ? 'Completa i campi obbligatori' : ''">
        <button hlmBtn [disabled]="!card()?.changed() || card()?.companyDataForm?.invalid || isSaving()" (click)="save()">
          {{ isSaving() ? 'Salvataggio…' : 'Salva' }}
        </button>
      </span>
    }
  </rocket-page-header>

  <!-- Reseller card -->
  @if (reseller(); as current) {
    <rocket-reseller-card
      class="flex-1 min-h-0 flex flex-col"
      [reseller]="current"
      [contract]="contract()"
      [editable]="canEdit()"
      [showEconomics]="canViewEconomics()"
      #card
    />
  }
</div>
