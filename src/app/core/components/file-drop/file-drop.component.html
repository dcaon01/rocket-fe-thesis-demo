<div
  hlmItem
  variant="outline"
  class="border-dashed rounded-xl transition-colors"
  rocketFileDropZone
  [fileDropDisabled]="disabled()"
  (filesDropped)="fileSelected.emit($event[0])"
>
  <div hlmItemMedia variant="icon" class="rk-icon-tile size-10">
    <ng-icon name="lucideFileUp" size="18" />
  </div>
  <div hlmItemContent class="min-w-0">
    @if (fileName(); as name) {
      <div class="w-full flex items-center gap-2 min-w-0">
        <div hlmItemTitle class="min-w-0 wrap-anywhere">{{ name }}</div>
        <button hlmBtn variant="ghost" size="icon" type="button" class="size-6 shrink-0 ml-auto" hlmTooltip="Rimuovi file" aria-label="Rimuovi file" (click)="cleared.emit()" [disabled]="disabled()">
          <ng-icon hlm name="lucideX" size="14" />
        </button>
      </div>
    } @else {
      <div hlmItemTitle>Trascina qui il file</div>
      @if (hint()) {
        <p hlmItemDescription>{{ hint() }}</p>
      }
    }
  </div>
  <div hlmItemActions>
    <button hlmBtn variant="outline" size="sm" type="button" (click)="fileInput.click()" [disabled]="disabled()">
      {{ fileName() ? 'Sostituisci il file' : 'Scegli il file' }}
      <ng-icon hlm name="lucideFileUp" size="16" />
    </button>
    <input #fileInput type="file" class="hidden" [accept]="accept()" (change)="onFileChosen($event)" />
  </div>
</div>
