<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header
    headerTitle="Dettaglio voce" [description]="canEdit() ? 'Modifica la voce da fatturare al cliente.' : 'Consulta la quota del contratto: segue il contratto e non si modifica.'"
  >
    @if (canEdit()) {
      <span class="inline-flex" [hlmTooltip]="!form.changed() ? 'Nessuna modifica da salvare' : form.chargeForm.invalid ? 'Completa i campi obbligatori' : ''">
        <button hlmBtn [disabled]="form.chargeForm.invalid || !form.changed()" (click)="updateCharge()">
          Conferma
        </button>
      </span>
    }
  </rocket-page-header>

  <!-- Item form -->
  <rocket-customer-charge-form class="flex-1 min-h-0 flex flex-col" #form [chargeData]="chargeData()" [readonly]="!!chargeData() && !canEdit()" />
</div>
