<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Crea tenant" description="Collega il tenant a una riga d'ordine o a una prova: lo crea il prodotto.">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="form?.tenantForm?.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form?.tenantForm?.invalid || !form.steps.allVisited()" (click)="createTenant(form.tenantForm)">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- Tenant form for creating a new tenant -->
  <rocket-tenant-form class="flex-1 min-h-0 flex flex-col" #form [creating]="true"/>
</div>
