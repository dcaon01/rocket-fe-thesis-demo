<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Dettaglio azienda" [description]="isReseller() ? 'Consulta dati, contratti, tenant e utenti del cliente.' : 'Consulta dati, contratti, tenant e utenti dell\'azienda.'">
    @if (canManage()) {
      <span class="inline-flex" [hlmTooltip]="!form?.changed() ? 'Nessuna modifica da salvare' : form?.companyForm?.invalid ? 'Completa i campi obbligatori' : ''">
        <button hlmBtn [disabled]="form?.companyForm?.invalid || !form?.changed()" (click)="editCompany(form.companyForm)">
          Conferma
        </button>
      </span>
    }
  </rocket-page-header>

  <!-- Company form for editing a company -->
  <rocket-company-form class="flex-1 min-h-0 flex flex-col" [companyData]="companyData()" [readonly]="!canManage()" #form/>
</div>
