<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Dettaglio collaboratore" description="Modifica dati di accesso e permessi del collaboratore.">
    <span class="inline-flex" [hlmTooltip]="!form?.changed() ? 'Nessuna modifica da salvare' : form?.collaboratorForm?.invalid ? 'Completa i campi obbligatori' : ''">
      <button hlmBtn [disabled]="form?.collaboratorForm?.invalid || !form?.changed()" (click)="editCollaborator(form.collaboratorForm)">
        Conferma
      </button>
    </span>
  </rocket-page-header>

  <!-- Collaborator form for creating a new collaborator -->
  <rocket-collaborator-form class="flex-1 min-h-0 flex flex-col" [collaboratorData]="collaboratorData()" #form/>
</div>
