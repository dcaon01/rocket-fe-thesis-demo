<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Crea materiale" description="Crea il materiale in bozza: i rivenditori lo vedono dopo la pubblicazione.">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="form.materialForm.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form.materialForm.invalid || !form.steps.allVisited()" (click)="createMaterial()">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- Material form -->
  <rocket-material-form class="flex-1 min-h-0 flex flex-col" #form [creating]="true" />
</div>
