<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Dettaglio prodotto" description="Modifica dati, integrazioni e strutture del prodotto.">
    <span class="inline-flex" [hlmTooltip]="!form?.changed() ? 'Nessuna modifica da salvare' : form?.productForm?.invalid ? 'Completa i campi obbligatori' : ''">
      <button hlmBtn [disabled]="form?.productForm?.invalid || !form?.changed()" (click)="editProduct(form.productForm)">
        Conferma
      </button>
    </span>
  </rocket-page-header>

  <!-- Product form for editing -->
  <rocket-product-form class="flex-1 min-h-0 flex flex-col" [productData]="productData()" (logoSelected)="onLogoSelected($event)" #form />
</div>
