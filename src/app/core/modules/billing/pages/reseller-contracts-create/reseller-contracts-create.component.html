<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Nuovo contratto rivenditore" description="Imposta canone, sconti e prodotti del contratto con il rivenditore.">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="form.contractForm.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form.contractForm.invalid || !form.steps.allVisited()" (click)="createContract()">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- Reseller contract form -->
  <rocket-reseller-contract-form class="flex-1 min-h-0 flex flex-col" #form [creating]="true" />
</div>
