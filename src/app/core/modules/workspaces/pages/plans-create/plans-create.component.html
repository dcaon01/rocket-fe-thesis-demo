<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Crea piano" description="Imposta prezzi e regole del nuovo piano.">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="form?.planForm?.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form?.planForm?.invalid || !form.steps.allVisited()" (click)="createPlan(form.planForm)">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- Plan form for creating a new plan -->
  <rocket-plan-form class="flex-1 min-h-0 flex flex-col" #form [creating]="true" />
</div>
