<hlm-popover sideOffset="5" align="start">
  <button hlmBtn variant="outline" type="button" [attr.id]="buttonId()" [disabled]="disabled()" hlmPopoverTrigger class="w-full justify-between font-normal">
    <span class="flex items-center gap-2 truncate">
      <ng-icon name="lucideListFilter" size="16" class="opacity-60" />
      {{ summary() }}
    </span>
    <ng-icon name="lucideChevronDown" size="16" class="ml-2 opacity-60" />
  </button>

  <!-- Options: the panel stays open while picking, and closes on a click outside -->
  <hlm-popover-content class="w-56 p-1 flex flex-col" role="menu" *hlmPopoverPortal="let ctx">
    <button hlmBtn variant="ghost" size="sm" type="button" role="menuitemcheckbox" [attr.aria-checked]="isAll()" class="w-full justify-between px-2 font-normal" (click)="toggleAll()">
      Tutti
      @if (isAll()) {
        <ng-icon name="lucideCheck" size="16" />
      }
    </button>
    <hlm-separator class="my-1" />
    @for (option of options(); track option.value) {
      <button hlmBtn variant="ghost" size="sm" type="button" role="menuitemcheckbox" [attr.aria-checked]="isSelected(option.value)" class="w-full justify-between px-2 font-normal" (click)="toggle(option.value)">
        {{ option.label }}
        @if (isSelected(option.value)) {
          <ng-icon name="lucideCheck" size="16" />
        }
      </button>
    }
  </hlm-popover-content>
</hlm-popover>
