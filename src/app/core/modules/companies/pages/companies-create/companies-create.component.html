<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Crea azienda" [description]="isReseller() ? 'Inserisci dati societari, contatti e fatturazione del cliente.' : 'Inserisci dati societari, contatti e fatturazione dell\'azienda.'">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="form?.companyForm?.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form?.companyForm?.invalid || !form.steps.allVisited()" (click)="createCompany(form.companyForm)">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- Company form for creating a new company -->
  <rocket-company-form class="flex-1 min-h-0 flex flex-col" #form [creating]="true"/>
</div>
