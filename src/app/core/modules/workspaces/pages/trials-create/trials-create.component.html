<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Crea trial" description="Scegli destinatario, durata e utenti della prova.">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="form?.trialForm?.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form?.trialForm?.invalid || !form.steps.allVisited()" (click)="createTrial(form.trialForm)">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- Trial form for creating a new trial -->
  <rocket-trial-form class="flex-1 min-h-0 flex flex-col" #form [creating]="true" />
</div>
