<div class="w-full h-full flex flex-col gap-6">
  <!-- Page header -->
  <rocket-page-header headerTitle="Crea collaboratore" description="Inserisci dati di accesso e permessi del collaboratore.">
    <rocket-form-toolbar [steps]="form.steps">
      <span class="inline-flex" [hlmTooltip]="!canSubmit() ? 'Attendi il caricamento del rivenditore' : form?.collaboratorForm?.invalid ? 'Completa i campi obbligatori' : !form.steps.allVisited() ? 'Apri prima tutte le sezioni' : ''">
        <button hlmBtn [disabled]="form?.collaboratorForm?.invalid || !canSubmit() || !form.steps.allVisited()" (click)="createCollaborator(form.collaboratorForm)">Conferma</button>
      </span>
    </rocket-form-toolbar>
  </rocket-page-header>

  <!-- Collaborator form for creating a new collaborator -->
  <rocket-collaborator-form class="flex-1 min-h-0 flex flex-col" [accountType]="accountType()" #form [creating]="true"/>
</div>
